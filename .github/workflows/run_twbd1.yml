name: Run TWBD Stock Screener

on:
  workflow_dispatch: # 支援網頁手動觸發
  # schedule:
  #   - cron: '15 5 * * 1-5' # 台北時間週一至週五 13:15 (UTC 05:15)

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests urllib3 yfinance

      - name: 執行 TWBD 選股腳本
        run: |
          python twbd.py
