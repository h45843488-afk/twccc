name: Run TWBD Stock Screener

on:
  workflow_dispatch:
  schedule:
    - cron: '10 5 * * 1-5' # 台北時間週一至週五 13:10 (UTC 05:10)

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests urllib3 yfinance

      - name: 執行 TWBD 選股腳本
        run: |
          python twbd.py
